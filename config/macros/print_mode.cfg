# print_mode.cfg — persistent bed-mesh toggle for PRINT_START
#
# PRINT_START decides whether to mesh from `do_mesh`: an explicit DO_MESH=
# parameter wins, else this saved value, else default 1 (mesh ON).
# Flip it from Mainsail with the buttons below; the choice survives reboots.

[save_variables]
filename: ~/printer_data/config/variables.cfg

[gcode_macro MESH_ON]
description: Bed mesh ON - PRINT_START calibrates a fresh mesh each print
gcode:
    SAVE_VARIABLE VARIABLE=do_mesh VALUE=1
    RESPOND MSG="Bed mesh: ON (full calibrate each print)"

[gcode_macro MESH_OFF]
description: Bed mesh OFF - PRINT_START loads the saved default mesh
gcode:
    SAVE_VARIABLE VARIABLE=do_mesh VALUE=0
    RESPOND MSG="Bed mesh: OFF (loads saved default mesh)"

[gcode_macro MESH_STATUS]
description: Show whether PRINT_START will mesh (changes nothing)
gcode:
    {% set dm = printer.save_variables.variables.do_mesh|default(1)|int %}
    {% if dm == 1 %}
        RESPOND MSG="Bed mesh mode: ON (PRINT_START will calibrate)"
    {% else %}
        RESPOND MSG="Bed mesh mode: OFF (PRINT_START loads saved default mesh)"
    {% endif %}
