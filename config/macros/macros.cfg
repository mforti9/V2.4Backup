#####################################################################
#	Macros
#####################################################################

## Filament sensor helpers for pause/resume/cancel (used by mainsail _CLIENT_VARIABLE).
## _OFF is idempotent via `variable_active`: calling PAUSE multiple times will NOT
## overwrite `saved_switch` / `saved_encoder` with 0 after the first call disables them.
## _ON restores each sensor's remembered pre-pause state and clears `active`.
[gcode_macro _FILAMENT_SENSORS_OFF]
variable_saved_switch: 1
variable_saved_encoder: 1
variable_active: 0
gcode:
    {% if printer["gcode_macro _FILAMENT_SENSORS_OFF"].active == 0 %}
        {% set sw = 1 if printer["filament_switch_sensor switch_sensor"].enabled else 0 %}
        {% set en = 1 if printer["filament_motion_sensor encoder_sensor"].enabled else 0 %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSORS_OFF VARIABLE=saved_switch VALUE={sw}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSORS_OFF VARIABLE=saved_encoder VALUE={en}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSORS_OFF VARIABLE=active VALUE=1
    {% endif %}
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0

[gcode_macro _FILAMENT_SENSORS_ON]
gcode:
    {% if printer["gcode_macro _FILAMENT_SENSORS_OFF"].active == 1 %}
        SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE={printer["gcode_macro _FILAMENT_SENSORS_OFF"].saved_switch}
        SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE={printer["gcode_macro _FILAMENT_SENSORS_OFF"].saved_encoder}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSORS_OFF VARIABLE=active VALUE=0
    {% endif %}

[gcode_macro _ON_PRINT_CANCEL]
description: Cleanup hook run by Mainsail CANCEL_PRINT
gcode:
    _FILAMENT_SENSORS_ON
    SET_SKEW CLEAR=1
    STATUS_READY

# Mainsail PAUSE/RESUME/CANCEL_PRINT read this block.
#  - PAUSE parks the toolhead FRONT-CENTER (easy filament changes / diagnosis)
#  - PAUSE disables both filament sensors; RESUME and CANCEL_PRINT restore them
#  - 1h idle timeout while paused (paired with pause-safe [idle_timeout] in printer.cfg)
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: True       ; use the custom park position below
variable_custom_park_x: 175.0       ; front-center X (bed center)
variable_custom_park_y: 5.0         ; front edge Y
variable_custom_park_dz: 5.0        ; z-hop on pause/cancel (lifts nozzle off the print)
variable_park_at_cancel: True       ; on CANCEL_PRINT, lift + park front-center (not rest on print)
variable_idle_timeout: 3600         ; seconds; keep alive 1h while paused, restored on resume
variable_user_pause_macro: "_FILAMENT_SENSORS_OFF"
variable_user_resume_macro: "_FILAMENT_SENSORS_ON"
variable_user_cancel_macro: "_ON_PRINT_CANCEL"
gcode:

# Abort the print if the gantry isn't homed AND quad-gantry-leveled.
# Called late in PRINT_START so it sees post-probe state (not call-time state).
[gcode_macro _REQUIRE_HOMED_QGL]
description: Safety gate - refuse to print without homing + QGL
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("PRINT_START aborted: printer is not homed") }
    {% endif %}
    {% if not printer.quad_gantry_level.applied %}
        { action_raise_error("PRINT_START aborted: QGL has not been applied") }
    {% endif %}

[gcode_macro G32]
description: Home, clean nozzle, cool to 150C at brush, QGL, re-home Z, and park center
gcode:
    SET_SKEW CLEAR=1
    BED_MESH_CLEAR
    STATUS_HOMING
    G28
    STATUS_CLEANING
    CLEAN_NOZZLE TARGET=150      ; clean hot if needed, then cool to 150C over the brush
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL FORCE=1
    STATUS_HOMING
    G28 Z
    M104 S0                      ; turn off probe heater when finished
    G0 X175 Y175 Z30 F3600
    STATUS_READY

## NOTE: PRINT_START refuses to run while HEAT_SOAK is active so [delayed_gcode heat_soaker]
## keeps its live MM:SS countdown and SKIP_HEAT_SOAK / CANCEL_HEAT_SOAK stay instant
## (holding gcode_mutex inside PRINT_START would block console commands and timers).
[gcode_macro PRINT_START]
description: Full print start sequence (accepts BED_TEMP, EXTRUDER_TEMP, optional CHAMBER_TEMP, DO_MESH)
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(params.BED|default(50))|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(params.HOTEND|default(200)))|float %}
    {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(params.CHAMBER|default(0))|float %}
    {% set DO_MESH = params.DO_MESH|default(printer.save_variables.variables.do_mesh|default(1))|int %}
    {% set PURGE_RETRACT = params.PURGE_RETRACT|default(8)|float %}   ; mm to retract before clean/cooldown to stop ooze

    # Refuse to start while a standalone HEAT_SOAK is running (run SKIP_HEAT_SOAK to keep bed hot and print immediately)
    {% if printer['gcode_macro HEAT_SOAK'].stage in ['heating', 'soaking'] %}
        { action_raise_error("Heat soak in progress — wait for it to finish, or click SKIP_HEAT_SOAK to keep the bed warm and start printing now") }
    {% endif %}

    # State at call time (Klipper renders all Jinja before running any line).
    # Re-probe Z whenever unhomed, un-QGL'd, meshing, or bed temp changed by >3C.
    {% set was_homed = 'xyz' in printer.toolhead.homed_axes %}
    {% set was_qgl   = printer.quad_gantry_level.applied %}
    {% set bed_temp_changed = (printer.heater_bed.temperature - BED_TEMP)|abs > 3.0 %}
    {% set need_probe = (not was_homed) or (not was_qgl) or (DO_MESH == 1) or bed_temp_changed %}

    SET_SKEW CLEAR=1                 ; keep machine-edge homing/wiping/purging unskewed
    _FILAMENT_SENSORS_ON             ; ensure sensors aren't stuck off from a prior aborted pause
    G90                              ; absolute coords
    M83                              ; extruder relative
    STATUS_BUSY
    SAVE_VARIABLE VARIABLE=last_hotend_temp VALUE={EXTRUDER_TEMP}   ; remember filament temp for CLEAN_NOZZLE

    # Park at nozzle brush, start heating bed
    CLEAN_NOZZLE_PARK
    M140 S{BED_TEMP}

    # Optional chamber temperature wait (uses [temperature_sensor Chamber] on SB2040)
    {% if CHAMBER_TEMP > 0 %}
        STATUS_HEATING
        M117 Waiting for bed ({BED_TEMP|int}C)...
        M190 S{BED_TEMP}
        {% if printer["temperature_sensor Chamber"].temperature < CHAMBER_TEMP %}
            M106 S130
            M117 Waiting for chamber ({CHAMBER_TEMP|int}C)...
            TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM={CHAMBER_TEMP}
            M106 S0
        {% endif %}
    {% endif %}

    # Heat nozzle to print temp for effective cleaning and wait for bed
    STATUS_HEATING
    M104 S{EXTRUDER_TEMP}
    M117 Waiting for bed...
    M190 S{BED_TEMP}
    M117 Heating nozzle...
    M109 S{EXTRUDER_TEMP}

    # Two-stage clean: wipe hot, retract, kill hotend heat, let residual ooze
    # emerge for ~5s, then wipe again with COLD_WIPE=1 so it doesn't re-heat.
    # LINE_PURGE absorbs the 8mm retract later.
    STATUS_CLEANING
    M117 Cleaning Nozzle...
    CLEAN_NOZZLE                     ; wipe 1 at print temp
    M83                              ; relative extrusion
    G1 E-{PURGE_RETRACT} F2400       ; retract to relieve pressure
    M104 S0                          ; hotend heater OFF (bed stays on)
    G4 P5000                         ; wait ~5s for cooldown ooze to emerge
    CLEAN_NOZZLE COLD_WIPE=1         ; wipe 2 removes cooldown ooze without re-heating

    # Probe at 150C for Tap when needed (fan-assisted cooldown over the rear brush)
    {% if need_probe %}
        M117 Cooling to 150C for probe...
        M106 S255
        M104 S150
        M109 S150
        M106 S0
        CLEAN_NOZZLE COLD_WIPE=1     ; final cold wipe at 150C for spotless Tap contact
        {% if not was_qgl %}
            STATUS_LEVELING
            M117 Performing QGL
            QUAD_GANTRY_LEVEL
        {% endif %}
        STATUS_HOMING
        M117 Homing Z...
        G28 Z                        ; fresh Z=0 reference on hot bed at 150C
        {% if DO_MESH == 1 %}
            STATUS_MESHING
            M117 Performing Adaptive Bed Mesh
            BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5
        {% else %}
            M117 Loading saved mesh
            BED_MESH_PROFILE LOAD=default
        {% endif %}
    {% else %}
        M117 Skipping probe (already homed + QGL'd at temp, mesh off)
        BED_MESH_PROFILE LOAD=default
    {% endif %}

    # Hard safety gate: never print without homing + QGL
    _REQUIRE_HOMED_QGL

    # Park over rear brush while reheating to print temp (prevents heat-up ooze over the bed)
    CLEAN_NOZZLE_PARK
    STATUS_HEATING
    M117 Heating to print temp...
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}

    # Purge unskewed, then load CaliFlower skew correction for the actual print
    STATUS_PRINTING
    M117 Printing...
    LINE_PURGE
    SKEW_PROFILE LOAD=CaliFlower
    M117 $MR$: Print Started

[gcode_macro PRINT_END]
description: Safely retract, z-hop within axis limits, clear skew, and park at rear
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set z_hop = [1.0, max_z - act_z]|min %}
    {% set z_park = [act_z + 11.0, max_z]|min %}

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F3600                 ; retract filament
    {% if z_hop > 0 %}
        G91                        ; relative positioning
        G0 Z{z_hop} F20000         ; quick move to break stringing
    {% endif %}
    TURN_OFF_HEATERS
    M106 S0                        ; turn off cooling fan
    G90                            ; absolute positioning
    SET_SKEW CLEAR=1               ; clear skew BEFORE moving near rear travel limits
    G1 Z{z_park} F3000             ; raise nozzle safely (clamped to max_z)
    G0 X303 Y350 F3600             ; park nozzle at rear (5mm margin from Y max 355)
    BED_MESH_CLEAR
    STATUS_READY
    RUN_SHELL_COMMAND CMD=sync_version_badge

[gcode_macro TEST_SPEED]
description: Velocity and acceleration stress test (checks for skipped steps)
gcode:
    # Speed
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(5)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    # Bounding inset for large pattern
    {% set bound = params.BOUND|default(20)|int %}
    # Size for small pattern box
    {% set smallpatternsize = params.SMALLPATTERNSIZE|default(20)|int %}
    
    # Large pattern
    {% set x_min = printer.toolhead.axis_minimum.x + bound %}
    {% set x_max = printer.toolhead.axis_maximum.x - bound %}
    {% set y_min = printer.toolhead.axis_minimum.y + bound %}
    {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    
    # Small pattern at center
    {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
    {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
    {% set x_center_min = x_center - (smallpatternsize/2) %}
    {% set x_center_max = x_center + (smallpatternsize/2) %}
    {% set y_center_min = y_center - (smallpatternsize/2) %}
    {% set y_center_max = y_center + (smallpatternsize/2) %}

    # Save current gcode state (absolute/relative, etc)
    SAVE_GCODE_STATE NAME=TEST_SPEED
    SET_SKEW CLEAR=1
    
    # Output parameters to g-code terminal
    { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
    
    # Home and get position for comparison later:
    G28
    {% if printer.configfile.settings.quad_gantry_level %}
        {% if printer.quad_gantry_level.applied == False %}
            QUAD_GANTRY_LEVEL
            G28 Z
        {% endif %}
    {% endif %} 
    # Move 50mm away from max position and home again (hall effect / switch repeatability check)
    G90
    G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
    G28 X Y
    G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
    G4 P1000 
    GET_POSITION

    # Go to starting position
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

    # Set new limits (compatible with both minimum_cruise_ratio and legacy max_accel_to_decel)
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO=0.5
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}

    {% for i in range(iterations) %}
        # Large pattern diagonals
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        
        # Large pattern box
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
    
        # Small pattern diagonals 
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        
        # Small pattern box
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    # Restore max speed/accel/cruise limits to their configured values
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    {% elif printer.configfile.settings.printer.max_accel_to_decel is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO=0.5
    {% endif %}

    # Re-home and get position again for comparison:
    G28
    G90
    G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
    G4 P1000 
    GET_POSITION

    # Restore previous gcode state (absolute/relative, etc)
    RESTORE_GCODE_STATE NAME=TEST_SPEED

[gcode_macro M600]
description: Filament change
gcode:
    PAUSE

[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|default(0)|float %}
    
    M104 {% for p in params %}{'%s%s ' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}    ; Wait for hotend temp (within 1 degree)
    {% endif %}
