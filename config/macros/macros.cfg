
#####################################################################
#	Macros
#####################################################################

## Filament sensor helpers for pause/resume (used by mainsail _CLIENT_VARIABLE).
## _OFF remembers each sensor's current state then disables both (so they don't
## re-fire while paused). _ON RESTORES the remembered state — so if you disabled a
## sensor for the whole print, resume leaves it disabled instead of forcing it on.
[gcode_macro _FILAMENT_SENSORS_OFF]
variable_saved_switch: 1
variable_saved_encoder: 1
gcode:
    {% set sw = 1 if printer["filament_switch_sensor switch_sensor"].enabled else 0 %}
    {% set en = 1 if printer["filament_motion_sensor encoder_sensor"].enabled else 0 %}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSORS_OFF VARIABLE=saved_switch VALUE={sw}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSORS_OFF VARIABLE=saved_encoder VALUE={en}
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0

[gcode_macro _FILAMENT_SENSORS_ON]
gcode:
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE={printer["gcode_macro _FILAMENT_SENSORS_OFF"].saved_switch}
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE={printer["gcode_macro _FILAMENT_SENSORS_OFF"].saved_encoder}

# Mainsail PAUSE/RESUME read this block.
#  - PAUSE parks the toolhead FRONT-CENTER (easy filament changes / diagnosis)
#  - PAUSE disables both filament sensors; RESUME re-enables them (activates the helpers above)
#  - 1h idle timeout while paused so the printer doesn't power down mid-change (restored on resume)
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: True       ; use the custom park position below
variable_custom_park_x: 175.0       ; front-center X (bed center)
variable_custom_park_y: 5.0         ; front edge Y
variable_custom_park_dz: 5.0        ; z-hop on pause/cancel (lifts nozzle off the print)
variable_park_at_cancel: True       ; on CANCEL_PRINT, lift + park front-center (not rest on print)
variable_idle_timeout: 3600         ; seconds; keep alive 1h while paused, restored on resume
variable_user_pause_macro: "_FILAMENT_SENSORS_OFF"
variable_user_resume_macro: "_FILAMENT_SENSORS_ON"
gcode:

# Abort the print if the gantry isn't homed AND quad-gantry-leveled.
# Called late in PRINT_START so it sees post-probe state (not call-time state).
[gcode_macro _REQUIRE_HOMED_QGL]
description: Safety gate - refuse to print without homing + QGL
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("PRINT_START aborted: printer is not homed") }
    {% endif %}
    {% if not printer.quad_gantry_level.applied %}
        { action_raise_error("PRINT_START aborted: QGL has not been applied") }
    {% endif %}

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    STATUS_HOMING
    G28
    STATUS_CLEANING
    CLEAN_NOZZLE                 ; clean tip (self-heats if cold) so QGL/Z probe accurately
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    STATUS_HOMING
    G28 Z
    G0 X175 Y175 Z30 F3600
    STATUS_READY
   
# Blocks while a HEAT_SOAK is running (stage heating/soaking); returns the moment
# it finishes or is cancelled. Polls every 3s so CANCEL_HEAT_SOAK takes effect
# quickly; N is a recursion-depth safety cap (~1h max).
[gcode_macro _WAIT_FOR_HEATSOAK]
description: Block until HEAT_SOAK completes or is cancelled
gcode:
    {% set n = params.N|default(0)|int %}
    {% set hs = printer['gcode_macro HEAT_SOAK'] %}
    {% if hs.stage in ['heating','soaking'] and n < 1200 %}
        {% if hs.stage == 'soaking' %}
            M117 Heat soak: {(hs.soak_time_remaining / 60.0)|round(1)}m left (CANCEL_HEAT_SOAK to skip)
        {% else %}
            M117 Heat soak: heating bed... (CANCEL_HEAT_SOAK to skip)
        {% endif %}
        G4 P3000
        _WAIT_FOR_HEATSOAK N={ n + 1 }
    {% endif %}

[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(50)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set DO_MESH = params.DO_MESH|default(printer.save_variables.variables.do_mesh|default(1))|int %}
    {% set PURGE_RETRACT = params.PURGE_RETRACT|default(8)|float %}   ; mm to retract before clean/cooldown to stop ooze
    # State at call time (Klipper renders all Jinja before running any line).
    # was_homed/was_qgl reset on power-off, motor-off (M84/idle), or restart.
    {% set was_homed = 'xyz' in printer.toolhead.homed_axes %}
    {% set was_qgl   = printer.quad_gantry_level.applied %}
    {% set need_probe = (not was_homed) or (not was_qgl) or (DO_MESH == 1) %}

    G90                              ; absolute coords
    M83                              ; extruder relative
    STATUS_BUSY
    SAVE_VARIABLE VARIABLE=last_hotend_temp VALUE={EXTRUDER_TEMP}   ; remember filament temp for CLEAN_NOZZLE

    # If a HEAT_SOAK is in progress, wait for it to finish before printing.
    # Run CANCEL_HEAT_SOAK to skip the remaining soak and start immediately.
    _WAIT_FOR_HEATSOAK

    # Park at nozzle brush, start heating bed
    CLEAN_NOZZLE_PARK
    M140 S{BED_TEMP}

    # Heat nozzle to print temp for effective cleaning
    STATUS_HEATING
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}
    M117 Waiting for bed...
    M190 S{BED_TEMP}

    # Two-stage clean: wipe hot, retract, kill hotend heat, let residual ooze
    # emerge for ~5s, then wipe again so it doesn't harden on the tip and throw
    # off Tap probing. Bed stays hot. LINE_PURGE re-primes the retract later.
    STATUS_CLEANING
    M117 Cleaning Nozzle...
    CLEAN_NOZZLE                     ; wipe 1 at print temp
    M83                              ; relative extrusion
    G1 E-{PURGE_RETRACT} F2400       ; retract to relieve pressure
    M104 S0                          ; hotend heater OFF (bed stays on)
    G4 P5000                         ; wait ~5s for cooldown ooze to emerge
    CLEAN_NOZZLE                     ; wipe 2 removes the cooldown ooze

    # Probe only if needed. QGL uses the Tap probe (needs ~150C), so the cool-to-150
    # happens ONLY when homing/QGL/mesh actually require it. (Homing itself was done
    # by CLEAN_NOZZLE_PARK above.) On a consecutive print that's still homed + QGL'd
    # with mesh off, we skip all of this and never leave print temp.
    {% if need_probe %}
        M117 Cooling to probe temp
        M104 S150
        M109 S150
        {% if not was_qgl %}
            STATUS_LEVELING
            M117 Performing QGL
            QUAD_GANTRY_LEVEL
            G28 Z                    ; re-home Z after leveling
        {% endif %}
        {% if DO_MESH == 1 %}
            STATUS_MESHING
            M117 Performing Bed Mesh
            BED_MESH_CALIBRATE
        {% else %}
            M117 Loading saved mesh
            BED_MESH_PROFILE LOAD=default
        {% endif %}
    {% else %}
        M117 Skipping probe (already homed + QGL'd, mesh off)
        BED_MESH_PROFILE LOAD=default
    {% endif %}

    # Hard safety gate: never print without homing + QGL (separate macro so it
    # evaluates the state AFTER the probe block ran, not at call time)
    _REQUIRE_HOMED_QGL

    # Restore print temp (the clean turned the hotend off; probe path cooled to 150)
    STATUS_HEATING
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}

    # Purge and start
    STATUS_PRINTING
    M117 Printing...
    LINE_PURGE
    M117 $MR$: Print Started

[gcode_macro PRINT_END]
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F3600                 ; retract filament
    G91                            ; relative positioning
    G0 Z1.00 F20000                ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M106 S0                        ; turn off cooling fan
    G1 Z10 F3000                   ; move nozzle up 10mm
    G90                            ; absolute positioning
    G0 X303 Y354 F3600             ; park nozzle at rear
    BED_MESH_CLEAR
    STATUS_READY

[gcode_macro TEST_SPEED]
gcode:
    # Speed
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(5)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    # Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
    {% set bound = params.BOUND|default(20)|int %}
    # Size for small pattern box
    {% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}
    
    # Large pattern
        # Max positions, inset by BOUND
        {% set x_min = printer.toolhead.axis_minimum.x + bound %}
        {% set x_max = printer.toolhead.axis_maximum.x - bound %}
        {% set y_min = printer.toolhead.axis_minimum.y + bound %}
        {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    
    # Small pattern at center
        # Find X/Y center point
        {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
        {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
        
        # Set small pattern box around center point
        {% set x_center_min = x_center - (smallpatternsize/2) %}
        {% set x_center_max = x_center + (smallpatternsize/2) %}
        {% set y_center_min = y_center - (smallpatternsize/2) %}
        {% set y_center_max = y_center + (smallpatternsize/2) %}

    # Save current gcode state (absolute/relative, etc)
    SAVE_GCODE_STATE NAME=TEST_SPEED
    
    # Output parameters to g-code terminal
    { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
    
    # Home and get position for comparison later:
        G28
        # QGL if not already QGLd (only if QGL section exists in config)
        {% if printer.configfile.settings.quad_gantry_level %}
            {% if printer.quad_gantry_level.applied == False %}
                QUAD_GANTRY_LEVEL
                G28 Z
            {% endif %}
        {% endif %} 
        # Move 50mm away from max position and home again (to help with hall effect endstop accuracy - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/24)
        G90
        G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
        G28 X Y
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Go to starting position
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

    # Set new limits
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}

    {% for i in range(iterations) %}
        # Large pattern
            # Diagonals
            G0 X{x_min} Y{y_min} F{speed*60}
            G0 X{x_max} Y{y_max} F{speed*60}
            G0 X{x_min} Y{y_min} F{speed*60}
            G0 X{x_max} Y{y_min} F{speed*60}
            G0 X{x_min} Y{y_max} F{speed*60}
            G0 X{x_max} Y{y_min} F{speed*60}
            
            # Box
            G0 X{x_min} Y{y_min} F{speed*60}
            G0 X{x_min} Y{y_max} F{speed*60}
            G0 X{x_max} Y{y_max} F{speed*60}
            G0 X{x_max} Y{y_min} F{speed*60}
        
        # Small pattern
            # Small diagonals 
            G0 X{x_center_min} Y{y_center_min} F{speed*60}
            G0 X{x_center_max} Y{y_center_max} F{speed*60}
            G0 X{x_center_min} Y{y_center_min} F{speed*60}
            G0 X{x_center_max} Y{y_center_min} F{speed*60}
            G0 X{x_center_min} Y{y_center_max} F{speed*60}
            G0 X{x_center_max} Y{y_center_min} F{speed*60}
            
            # Small box
            G0 X{x_center_min} Y{y_center_min} F{speed*60}
            G0 X{x_center_min} Y{y_center_max} F{speed*60}
            G0 X{x_center_max} Y{y_center_max} F{speed*60}
            G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    # Restore max speed/accel/accel_to_decel to their configured values
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel} 

    # Re-home and get position again for comparison:
        G28
        # Go to XY home positions (in case your homing override leaves it elsewhere)
        G90
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Restore previous gcode state (absolute/relative, etc)
    RESTORE_GCODE_STATE NAME=TEST_SPEED

[gcode_macro M600]
gcode:
    #LCDRGB R=0 G=1 B=0  ; Turn LCD green
    PAUSE                ; Pause

[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}

