[gcode_macro CLEAN_NOZZLE_PARK]
description: Safely raise Z, move over the rear nozzle brush, and park at Z6
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

  G90
  {% if printer.toolhead.position.z < 10 %}
    G1 Z10 F1500
  {% endif %}
  G1 X310 Y353 F6000
  G1 Z6 F1500

[gcode_macro CLEAN_NOZZLE]
description: Scrub nozzle on rear brush (self-heats if cold unless COLD_WIPE=1; optional post-wipe TARGET temp)
variable_start_x: 303
variable_start_y: 351
variable_start_z: 4
variable_wipe_dist: -35
variable_wipe_qty: 10
variable_wipe_spd: 100
variable_raise_distance: 20

gcode:
  {% set cold_wipe = params.COLD_WIPE|default(0)|int %}
  {% set target_after = params.TARGET|default(-1)|float %}

  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

  SAVE_GCODE_STATE NAME=clean_nozzle_state
  G90                                            ; absolute positioning

  ## Lift Z before XY travel so the nozzle never clips the bed or brush mount
  {% if printer.toolhead.position.z < 10 %}
    G1 Z10 F1500
  {% endif %}

  ## Move nozzle to brush start XY
  G1 X{start_x} Y{start_y} F6000

  ## Ensure the nozzle is hot enough to release filament unless COLD_WIPE=1.
  ## Track whether we self-heated from an idle/off hotend so we don't leave it hot forever.
  {% set min_et = printer.configfile.settings.extruder.min_extrude_temp %}
  {% set wipe_min = min_et + 10 %}
  {% set last = printer.save_variables.variables.last_hotend_temp|default(220)|float %}
  {% set heat_to = last if last >= wipe_min else 220 %}
  {% set auto_heated = (cold_wipe == 0) and (printer.extruder.temperature < wipe_min) and (printer.extruder.target < wipe_min) %}

  {% if cold_wipe == 0 and printer.extruder.temperature < wipe_min %}
    M117 Heating nozzle to clean...
    M104 S{heat_to}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={heat_to}
    M83
    G1 E-2.0 F1800                               ; relieve pressure if self-heated from cold
  {% endif %}

  G1 Z{start_z} F1500

  ## Wipe nozzle
  {% for wipes in range(1, (wipe_qty + 1)) %}
    G1 X{start_x + wipe_dist} F{wipe_spd * 60}
    G1 X{start_x} F{wipe_spd * 60}
  {% endfor %}

  ## Post-wipe temperature handling:
  ## - TARGET >= 0 (e.g. G32 passing TARGET=150): set to TARGET; if cooling to a probe temp,
  ##   cool with fan assist over the brush and do 3 quick wipes to clear any cooldown ooze.
  ## - Otherwise, if we auto-heated from an off hotend (standalone Mainsail click), turn heater off.
  {% if target_after >= 0 %}
    M104 S{target_after}
    {% if target_after > 0 and printer.extruder.temperature > target_after + 5 %}
      M117 Cooling nozzle to {target_after|int}C...
      M106 S255
      M109 S{target_after}
      M106 S0
      {% for wipes in range(3) %}
        G1 X{start_x + wipe_dist} F{wipe_spd * 60}
        G1 X{start_x} F{wipe_spd * 60}
      {% endfor %}
    {% endif %}
  {% elif auto_heated %}
    M104 S0
  {% endif %}

  ## Raise nozzle with explicit Z feedrate
  G1 X282 Z{raise_distance} F1500
  RESTORE_GCODE_STATE NAME=clean_nozzle_state
