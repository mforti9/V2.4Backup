[gcode_macro HEAT_SOAK]
description: Heats the bed and circulates chamber air for DURATION minutes (TARGET=110 DURATION=20)

variable_target_temp: 0
variable_stage: None ## heating -> soaking -> done -> None
variable_fan_speed: 130 ## 0-255, default ~51% — override with SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=fan_speed VALUE=xx

## in seconds
variable_check_interval: 10
variable_soak_time_remaining: 0
variable_total_time_elapsed: 0

gcode:
    {% set TARGET = params.TARGET | default(110) | float %}
    {% set DURATION = (params.DURATION | default(15) | int) * 60 %} ## minutes to seconds

    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=target_temp         VALUE={ TARGET }
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=stage               VALUE="'heating'"
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=soak_time_remaining VALUE={ DURATION }
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=total_time_elapsed  VALUE=0

    ;; fire up the heater
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={ TARGET }

    ;; put the bed and nozzle at center where air circulates well
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G0 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } Z30 F7200

    ;; run the fan to circulate air
    M106 S{printer['gcode_macro HEAT_SOAK'].fan_speed}

    M84 ;; turn off steppers during idle soak

    M117 $MR$: Heat Soaking
    UPDATE_DELAYED_GCODE ID=heat_soaker DURATION={ check_interval }

[gcode_macro SKIP_HEAT_SOAK]
description: Stop the remaining HEAT_SOAK timer while keeping the bed heater ON (ready to print)
gcode:
    UPDATE_DELAYED_GCODE ID=heat_soaker DURATION=0
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=stage               VALUE="'done'"
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=soak_time_remaining VALUE=0
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=total_time_elapsed  VALUE=0
    {% if printer.print_stats.state not in ["printing", "paused"] %}
        M107 ; turn off circulation fan
    {% endif %}
    M117 Heat soak skipped (bed kept warm)

[gcode_macro CANCEL_HEAT_SOAK]
description: Cancel an in-progress HEAT_SOAK cycle and turn off heaters (safe no-op if printing)
gcode:
    UPDATE_DELAYED_GCODE ID=heat_soaker DURATION=0
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=stage               VALUE="'done'"
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=target_temp         VALUE=0
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=soak_time_remaining VALUE=0
    SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=total_time_elapsed  VALUE=0
    {% if printer.print_stats.state not in ["printing", "paused"] %}
        TURN_OFF_HEATERS
        M107 ; turn off fan
        M117 $MR$: Soak Cancelled
        M117 Heat soak cancelled
    {% else %}
        RESPOND MSG="CANCEL_HEAT_SOAK: cleared soak state (heaters kept active because a print is running)"
    {% endif %}

[delayed_gcode heat_soaker]
gcode:
    {% set heat_soak = printer['gcode_macro HEAT_SOAK'] %}
    {% set stage = heat_soak.stage %}

    {% if stage in ("heating", "soaking") %}
        ## update total time elapsed
        {% set total_time_elapsed = heat_soak.total_time_elapsed + heat_soak.check_interval %}
        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=total_time_elapsed VALUE={ total_time_elapsed }

        {% if stage == "heating" and printer.heater_bed.temperature >= heat_soak.target_temp %}
            {% set stage = "soaking" %}
        {% endif %}

        {% if stage == "soaking" %}
            ## update soak countdown
            {% set soak_time_remaining = [heat_soak.soak_time_remaining - heat_soak.check_interval, 0] | max %}
            SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=soak_time_remaining VALUE={ soak_time_remaining }

            {% if soak_time_remaining == 0 %}
                {% set stage = "done" %}
            {% endif %}
        {% endif %}

        SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=stage VALUE="'{ stage }'"

        {% if stage == "done" %}
            M107 ; turn off circulation fan, leave bed warm at target_temp
            M117 $MR$: Soak Complete
            M117 { "soak complete after %.1fm" | format(total_time_elapsed / 60.0) }
            SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=soak_time_remaining VALUE=0
            SET_GCODE_VARIABLE MACRO=HEAT_SOAK VARIABLE=total_time_elapsed  VALUE=0
        {% else %}
            ## update the status message every tick so the countdown stays live
            {% if stage == "heating" %}
                M117 { "heating bed -- %d:%02d elapsed" | format(total_time_elapsed // 60, total_time_elapsed % 60) }
            {% elif stage == "soaking" %}
                M117 { "soaking -- %d:%02d remaining" | format(soak_time_remaining // 60, soak_time_remaining % 60) }
            {% endif %}

            ## trigger ourselves again
            UPDATE_DELAYED_GCODE ID=heat_soaker DURATION={ heat_soak.check_interval }

            ## dwell for 1ms to prevent from going idle while soaking
            G4 P1
        {% endif %}
    {% endif %}

[gcode_macro CENTER]
description: Move toolhead to the center of the build volume
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G0 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } Z{ printer.toolhead.axis_maximum.z/2 } F7200
