# git_backup.cfg — Macros for backing up / promoting Klipper config via git.
#
# Complements git_deploy.cfg (which only PULLS). These PUSH:
#
#   BACKUP_CONFIG               Commit current config + push to the current branch
#   BACKUP_CONFIG MESSAGE="..." Same, with a custom commit message
#   PROMOTE_CONFIG              Fast-forward main up to dev (mark dev as stable)
#
# Dev-first workflow:
#   CONFIG_SWITCH_DEV  ->  edit  ->  BACKUP_CONFIG  ->  test  ->  PROMOTE_CONFIG  ->  CONFIG_SWITCH_MAIN
#
# NOTE: hardcoded paths assume the Pi username is 'pi'.

#####################################################################
#   Shell Commands
#####################################################################

# NOTE: this gcode_shell_command extension does NOT substitute $0/$1 — it simply
# APPENDS the (shlex-split) PARAMS string as extra args. So a single-quoted
# PARAMS="'{msg}'" arrives as $1 in git_backup.sh. No $0 placeholder needed.
[gcode_shell_command git_backup_cmd]
command: bash /home/pi/printer_data/scripts/git_backup.sh
timeout: 60.0
verbose: True

[gcode_shell_command git_promote_cmd]
command: bash /home/pi/printer_data/scripts/git_promote.sh
timeout: 60.0
verbose: True

#####################################################################
#   G-code Macros
#####################################################################

[gcode_macro BACKUP_CONFIG]
description: Commit current config and push it to GitHub (current branch)
gcode:
    {% set msg = params.MESSAGE|default("") %}
    RESPOND MSG="Backing up config to GitHub — check console for progress..."
    {% if msg|length > 0 %}
        RUN_SHELL_COMMAND CMD=git_backup_cmd PARAMS="'{msg}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=git_backup_cmd
    {% endif %}

[gcode_macro PROMOTE_CONFIG]
description: Promote dev branch to main (mark current dev as the stable config)
gcode:
    RESPOND MSG="Promoting dev -> main — check console for progress..."
    RUN_SHELL_COMMAND CMD=git_promote_cmd
