[gcode_macro SINGLE_LAYER_TEST]
description: "Print a single-layer square test with adjustable parameters and infill"
gcode:
  {% set bed_temp       = params.BED|default(60)|float %}
  {% set extruder_temp  = params.EXTRUDER|default(200)|float %}
  {% set layer_height   = params.LAYER_HEIGHT|default(0.2)|float %}
  {% set print_speed    = params.SPEED|default(30)|float %}
  {% set side_length    = params.SIZE|default(100)|float %}
  {% set infill_spacing = params.INFILL_SPACING|default(10)|float %}

  # 1) Set (but don't wait for) bed temperature
  M140 S{bed_temp}
  # 2) Set (but don't wait for) extruder temperature
  M104 S{extruder_temp}
  # 3) Home all axes
  G28

  # 4) Wait for bed temperature
  M190 S{bed_temp}
  # 5) Wait for extruder temperature
  M109 S{extruder_temp}

  CLEAN_NOZZLE_PARK
  CLEAN_NOZZLE
  # 6) Set absolute positioning
  G90
  # 7) Move nozzle to a safe Z height
  G1 Z5 F600
  # 8) Move to the start position near front-left of bed
  G1 X10 Y10 F3000

  # Optional: Prime extruder (short line)
  G1 Z{layer_height} F600
  G1 E5 F120      ; small extrusion for priming
  G1 X20 Y10 E5 F{print_speed*60}

  # 9) Wipe nozzle or retract if desired
  G1 E-1 F300     ; retract a little for move
  G1 X10 Y10 F3000

  # Reset extruder relative position
  G92 E0

  # 10) Draw the perimeter of the square
  {% set line_width = 0.4 %}
  {% set filament_diameter = 1.75 %}
  {% set filament_area = (filament_diameter/2)**2 * 3.14159 %}
  {% set extrusion_per_mm = (line_width * layer_height) / filament_area %}
  {% set e_side = side_length * extrusion_per_mm %}

  ; Move to starting corner
  G1 X10 Y10 Z{layer_height} F3000
  G1 E0    ; reset extruder position

  ; First edge
  G1 X{10 + side_length} Y10 E{e_side} F{print_speed*60}
  ; Second edge
  G1 X{10 + side_length} Y{10 + side_length} E{e_side} F{print_speed*60}
  ; Third edge
  G1 X10 Y{10 + side_length} E{e_side} F{print_speed*60}
  ; Fourth edge
  G1 X10 Y10 E{e_side} F{print_speed*60}

  # 11) Fill the interior with a grid pattern
  {% set num_lines = (side_length) // infill_spacing %}
  {% set e_line = (infill_spacing * extrusion_per_mm) %}

  ; Horizontal infill lines
  {% for i in range(1, num_lines) %}
    {% set y = 10 + i * infill_spacing %}
    G1 X{10 + side_length} Y{y} E{e_line} F{print_speed*60}
    G1 X10 Y{y} E{e_line} F{print_speed*60}
  {% endfor %}

  ; Vertical infill lines
  {% for i in range(1, num_lines) %}
    {% set x = 10 + i * infill_spacing %}
    G1 X{x} Y{10 + side_length} E{e_line} F{print_speed*60}
    G1 X{x} Y10 E{e_line} F{print_speed*60}
  {% endfor %}

  # 12) Retract a bit
  G1 E-2 F300

  # Move nozzle up and away
  G1 Z10 F600
  G1 X0 Y0 F6000

  # Optional: turn off extruder/beds
  ;M104 S0
  ;M140 S0

  # The single-layer test with infill is complete!
