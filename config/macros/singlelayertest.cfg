[gcode_macro SINGLE_LAYER_TEST]
description: "Print a centered single-layer square test with serpentine infill"
gcode:
  {% set nozzle_dia     = printer.configfile.settings.extruder.nozzle_diameter|float %}
  {% set bed_temp       = params.BED|default(60)|float %}
  {% set extruder_temp  = params.EXTRUDER|default(200)|float %}
  {% set layer_height   = params.LAYER_HEIGHT|default(0.2)|float %}
  {% set line_width     = params.LINE_WIDTH|default(nozzle_dia)|float %}
  {% set print_speed    = params.SPEED|default(40)|float %}
  {% set side_length    = params.SIZE|default(100)|float %}
  {% set infill_spacing = params.INFILL_SPACING|default(10)|float %}

  {% set x_center = printer.toolhead.axis_maximum.x|float / 2.0 %}
  {% set y_center = printer.toolhead.axis_maximum.y|float / 2.0 %}
  {% set x0 = x_center - (side_length / 2.0) %}
  {% set y0 = y_center - (side_length / 2.0) %}
  {% set x1 = x0 + side_length %}
  {% set y1 = y0 + side_length %}

  {% set filament_diameter = printer.configfile.settings.extruder.filament_diameter|float %}
  {% set filament_area = (filament_diameter / 2.0) ** 2 * 3.14159265 %}
  {% set cross_section = (line_width - layer_height) * layer_height + 3.14159265 * (layer_height / 2.0) ** 2 %}
  {% set extrusion_per_mm = cross_section / filament_area %}
  {% set e_side = (side_length * extrusion_per_mm)|round(5) %}
  {% set e_step = (infill_spacing * extrusion_per_mm)|round(5) %}

  # Full start sequence (handles Tap 150C probing, QGL, mesh, nozzle scrub, purge, skew)
  PRINT_START BED_TEMP={bed_temp} EXTRUDER_TEMP={extruder_temp}

  G90
  M83 ; relative extrusion mode (required for constant per-segment E values)
  G92 E0

  # Move to starting corner
  G0 X{x0} Y{y0} Z{layer_height * 2} F9000
  G1 Z{layer_height} F1200

  # Draw outer square perimeter
  G1 X{x1} Y{y0} E{e_side} F{print_speed * 60}
  G1 X{x1} Y{y1} E{e_side} F{print_speed * 60}
  G1 X{x0} Y{y1} E{e_side} F{print_speed * 60}
  G1 X{x0} Y{y0} E{e_side} F{print_speed * 60}

  # Serpentine horizontal infill lines
  {% set num_lines = (side_length // infill_spacing)|int %}
  {% for i in range(1, num_lines) %}
    {% set y = y0 + i * infill_spacing %}
    {% if i % 2 == 1 %}
      G1 X{x0} Y{y} E{e_step} F{print_speed * 60}
      G1 X{x1} Y{y} E{e_side} F{print_speed * 60}
    {% else %}
      G1 X{x1} Y{y} E{e_step} F{print_speed * 60}
      G1 X{x0} Y{y} E{e_side} F{print_speed * 60}
    {% endif %}
  {% endfor %}

  # Retract, travel to start of vertical serpentine infill, and unretract
  G1 E-0.8 F2400
  G0 Z{layer_height * 2} F1800
  G0 X{x0} Y{y0} F9000
  G1 Z{layer_height} F1200
  G1 E0.8 F2400

  # Serpentine vertical infill lines
  {% for i in range(1, num_lines) %}
    {% set x = x0 + i * infill_spacing %}
    {% if i % 2 == 1 %}
      G1 X{x} Y{y0} E{e_step} F{print_speed * 60}
      G1 X{x} Y{y1} E{e_side} F{print_speed * 60}
    {% else %}
      G1 X{x} Y{y1} E{e_step} F{print_speed * 60}
      G1 X{x} Y{y0} E{e_side} F{print_speed * 60}
    {% endif %}
  {% endfor %}

  PRINT_END
