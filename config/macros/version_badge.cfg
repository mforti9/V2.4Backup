# version_badge.cfg — Automatically displays the active git branch + commit hash
# in Mainsail's top-left header ("V2.4 [DEV • a9adb57]" vs "V2.4 [MAIN • a9adb57]"),
# switches the UI accent color to amber when on 'dev', and sets an idle M117 status line.

[gcode_shell_command sync_version_badge]
command: bash /home/pi/printer_data/config/macros/version_badge.sh
timeout: 15.0
verbose: False

[gcode_shell_command pi_diag_cmd]
command: bash /home/pi/printer_data/config/macros/version_badge.sh --diag
timeout: 20.0
verbose: True

# Sync Mainsail's header banner automatically 2s after every Klipper startup/restart
[delayed_gcode sync_version_badge_on_boot]
initial_duration: 2.0
gcode:
    {% if printer.print_stats.state not in ["printing", "paused"] %}
        RUN_SHELL_COMMAND CMD=sync_version_badge
    {% endif %}
