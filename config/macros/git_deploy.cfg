# git_deploy.cfg — Macros for deploying Klipper config from GitHub
#
# Exposes four macros in the Mainsail macro panel:
#
#   DEPLOY_CONFIG       Pull latest from current branch → restart Klipper
#   CONFIG_SWITCH_DEV   Switch to dev branch → pull → restart Klipper
#   CONFIG_SWITCH_MAIN  Switch to main branch → pull → restart Klipper (rollback)
#   CONFIG_STATUS       Show current branch + last commit (no pull, no restart)
#
# The shell script handles the FIRMWARE_RESTART internally via the Moonraker API
# so restart only fires on a successful pull — never on a failed one.
#
# NOTE: If the Pi username is not 'pi', update the hardcoded paths below.
#       $HOME does not expand reliably in Klipper's subprocess context.

#####################################################################
#   Shell Commands
#####################################################################

[gcode_shell_command git_pull]
command: bash /home/pi/printer_data/scripts/git_deploy.sh
timeout: 60.0
verbose: True

[gcode_shell_command git_switch_dev]
command: bash /home/pi/printer_data/scripts/git_deploy.sh dev
timeout: 60.0
verbose: True

[gcode_shell_command git_switch_main]
command: bash /home/pi/printer_data/scripts/git_deploy.sh main
timeout: 60.0
verbose: True

[gcode_shell_command git_status_cmd]
command: bash /home/pi/printer_data/scripts/git_deploy.sh --status
timeout: 10.0
verbose: True

#####################################################################
#   G-code Macros
#####################################################################

[gcode_macro DEPLOY_CONFIG]
description: Pull latest config from current git branch and restart Klipper
gcode:
    RESPOND MSG="Deploying config from current branch — check console for progress..."
    RUN_SHELL_COMMAND CMD=git_pull

[gcode_macro CONFIG_SWITCH_DEV]
description: Switch to dev branch, pull latest config, restart Klipper
gcode:
    RESPOND MSG="Switching to dev branch — check console for progress..."
    RUN_SHELL_COMMAND CMD=git_switch_dev

[gcode_macro CONFIG_SWITCH_MAIN]
description: Switch to main branch (stable rollback), pull latest config, restart Klipper
gcode:
    RESPOND MSG="Rolling back to main branch — check console for progress..."
    RUN_SHELL_COMMAND CMD=git_switch_main

[gcode_macro CONFIG_STATUS]
description: Show current git branch and last commit (no restart)
gcode:
    RESPOND MSG="Checking config git status..."
    RUN_SHELL_COMMAND CMD=git_status_cmd
