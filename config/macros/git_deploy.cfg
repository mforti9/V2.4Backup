# git_deploy.cfg — Macros for deploying Klipper config from GitHub
#
# Exposes four macros in the Mainsail macro panel:
#
#   DEPLOY_CONFIG       Pull latest from current branch → update badge → restart Klipper
#   CONFIG_SWITCH_DEV   Switch to dev branch → pull → amber DEV badge → restart Klipper
#   CONFIG_SWITCH_MAIN  Switch to main branch → pull → blue MAIN badge → restart Klipper
#   CONFIG_STATUS       Show current branch + last commit and refresh Mainsail header badge
#
# All restart-triggering macros refuse to run if a print is currently active or paused.

#####################################################################
#   Shell Commands
#####################################################################

[gcode_shell_command git_pull]
command: bash /home/pi/printer_data/config/macros/version_badge.sh --deploy
timeout: 60.0
verbose: True

[gcode_shell_command git_switch_dev]
command: bash /home/pi/printer_data/config/macros/version_badge.sh --deploy dev
timeout: 60.0
verbose: True

[gcode_shell_command git_switch_main]
command: bash /home/pi/printer_data/config/macros/version_badge.sh --deploy main
timeout: 60.0
verbose: True

[gcode_shell_command git_status_cmd]
command: bash /home/pi/printer_data/scripts/git_deploy.sh --status
timeout: 10.0
verbose: True

#####################################################################
#   G-code Macros
#####################################################################

[gcode_macro DEPLOY_CONFIG]
description: Pull latest config from current git branch and restart Klipper
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("DEPLOY_CONFIG blocked: cannot restart Klipper while a print is active or paused!") }
    {% endif %}
    RESPOND MSG="Deploying config from current branch — check console for progress..."
    RUN_SHELL_COMMAND CMD=git_pull

[gcode_macro CONFIG_SWITCH_DEV]
description: Switch to dev branch, pull latest config, restart Klipper
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("CONFIG_SWITCH_DEV blocked: cannot restart Klipper while a print is active or paused!") }
    {% endif %}
    RESPOND MSG="Switching to dev branch — check console for progress..."
    RUN_SHELL_COMMAND CMD=git_switch_dev

[gcode_macro CONFIG_SWITCH_MAIN]
description: Switch to main branch (stable rollback), pull latest config, restart Klipper
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("CONFIG_SWITCH_MAIN blocked: cannot restart Klipper while a print is active or paused!") }
    {% endif %}
    RESPOND MSG="Rolling back to main branch — check console for progress..."
    RUN_SHELL_COMMAND CMD=git_switch_main

[gcode_macro CONFIG_STATUS]
description: Show current git branch and last commit and sync Mainsail header badge
gcode:
    RESPOND MSG="Checking config git status..."
    RUN_SHELL_COMMAND CMD=git_status_cmd
    RUN_SHELL_COMMAND CMD=sync_version_badge
