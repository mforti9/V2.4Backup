[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
description: Level gantry if not already leveled (pass FORCE=1 to re-level unconditionally)
gcode:
    {% set force = params.FORCE|default(0)|int %}
    {% if printer.quad_gantry_level.applied|default(False) == False or force == 1 %}
      _QUAD_GANTRY_LEVEL {% for p in params %}{% if p != 'FORCE' %}{'%s=%s ' % (p, params[p])}{% endif %}{% endfor %}
    {% else %}
      RESPOND MSG="QUAD_GANTRY_LEVEL skipped (already leveled — pass FORCE=1 to re-level)"
    {% endif %}
