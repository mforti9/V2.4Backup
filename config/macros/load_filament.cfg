[gcode_macro LOAD_FILAMENT]
description: Load filament and purge (temporarily suppresses runout sensors during motion)
variable_load_distance:  115
variable_purge_distance:  30
gcode:
    {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp %}
    {% if not printer.extruder.can_extrude %}
        { action_raise_error("Hotend too cold to load filament — heat to at least %dC first (currently %.0fC)" % (min_temp, printer.extruder.temperature)) }
    {% endif %}
    {% set speed = params.SPEED|default(200) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity * 60 %}
    {% set sw_was_on = 1 if printer["filament_switch_sensor switch_sensor"].enabled else 0 %}
    {% set en_was_on = 1 if printer["filament_motion_sensor encoder_sensor"].enabled else 0 %}

    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    G1 E{load_distance} F{max_velocity} ; fast-load
    G1 E{purge_distance} F{speed}       ; purge
    M400                                ; finish moves before restoring sensors
    RESTORE_GCODE_STATE NAME=load_state
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE={sw_was_on}
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE={en_was_on}

[gcode_macro UNLOAD_FILAMENT]
description: Purge slightly and unload filament (temporarily suppresses runout sensors during motion)
variable_unload_distance:  115
variable_purge_distance:  25
gcode:
    {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp %}
    {% if not printer.extruder.can_extrude %}
        { action_raise_error("Hotend too cold to unload filament — heat to at least %dC first (currently %.0fC)" % (min_temp, printer.extruder.temperature)) }
    {% endif %}
    {% set speed = params.SPEED|default(200) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity * 60 %}
    {% set sw_was_on = 1 if printer["filament_switch_sensor switch_sensor"].enabled else 0 %}
    {% set en_was_on = 1 if printer["filament_motion_sensor encoder_sensor"].enabled else 0 %}

    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    G1 E{purge_distance} F{speed}          ; purge to form clean tip
    G1 E-{unload_distance} F{max_velocity} ; fast-unload
    M400                                   ; finish moves before restoring sensors
    RESTORE_GCODE_STATE NAME=unload_state
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE={sw_was_on}
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE={en_was_on}
